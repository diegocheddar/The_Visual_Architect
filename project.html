<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Project</title>
    <meta name="description" content="The Visual Architect is a design-focused digital creative studio translating architectural, interior and product ideas into clear, atmospheric visual experiences.">
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="favicon" href="/assets/favicon.svg" />
  </head>


  <body class="fade-page">
    <header class="site-header">
      <a class="brand" href="index.html"><img class="header-brand-logo" src="assets/favicon.svg" alt="" aria-hidden="true"><span>The Visual Architect</a>
        <button class="text-link" data-open-text>info</button>
    </header>


    <main class="project">
      <div class="project-stage" data-project-gallery>
        <div class="project-image-wrap">
          <button
            class="project-arrow project-arrow-left"
            type="button"
            data-project-prev
            aria-label="Previous image"
          >
            <span></span>
          </button>
          <img
            class="hero"
            data-project-image
            src="assets/project-1.jpg"
            alt="Project image"
          />
          <button
            class="project-arrow project-arrow-right"
            type="button"
            data-project-next
            aria-label="Next image"
          >
            <span></span>
          </button>
        </div>
        <div class="project-footer">
          <span class="counter" data-project-counter>1 – 1</span>
        </div>
      </div>
    </main>
    <section class="overlay" id="textOverlay">
      <button class="close" data-close-text aria-label="Close">×</button>
      <article class="text-panel">
        <h1 data-project-title>Project</h1>
        <p data-project-subtitle></p>
        <div data-project-text></div>
      </article>
    </section>
    <script src="project-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
